<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BMW in Rain</title>
  <style>
    body {
      margin: 0;
      background: linear-gradient(#2c3e50, #34495e);
      overflow: hidden;
      font-family: sans-serif;
    }

    .road {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 150px;
      background: #2c3e50;
    }

    .car {
      position: absolute;
      bottom: 160px;
      left: -200px;
      width: 200px;
      height: 100px;
      background: url('https://upload.wikimedia.org/wikipedia/commons/thumb/4/44/BMW_logo_%28gray%29.svg/1200px-BMW_logo_%28gray%29.svg.png') no-repeat center;
      background-size: contain;
      animation: drive 8s linear infinite;
    }

    @keyframes drive {
      0% { left: -200px; }
      100% { left: 100%; }
    }

    .rain {
      position: absolute;
      top: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background-image: url('https://i.ibb.co/6WZyJZg/rain.gif');
      background-size: cover;
      opacity: 0.5;
    }

    h1 {
      position: absolute;
      top: 20px;
      width: 100%;
      text-align: center;
      color: white;
      font-size: 2em;
      text-shadow: 2px 2px #000;
    }
  </style>
</head>
<body>
  <h1>BMW Cruising Through Rain</h1>
  <div class="rain"></div>
  <div class="car"></div>
  <div class="road"></div>
</body>
</html>
